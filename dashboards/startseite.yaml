                name: Person 1
                icon_type: icon
                primary_info: none
                secondary_info: none
                layout: vertical
                card_mod:
                  style: *person_chip_style
              - type: custom:mushroom-person-card
                entity: person.person_2
                name: Person 2
                icon_type: icon
                primary_info: none
                secondary_info: none
                layout: vertical
                card_mod:
                  style: *person_chip_style
      - type: custom:mushroom-template-card
        view_layout:
          grid-area: title
          align-self: center
          justify-self: center
        primary: ÜBERSICHT
        secondary: Gesamte Wohnung
