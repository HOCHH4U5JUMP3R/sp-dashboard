              navigation_path: /lovelace/sicherheit
          - type: template
            icon: mdi:server
            content: Server
            tap_action:
              action: navigate
              navigation_path: /lovelace/server
          - type: template
            icon: mdi:cog-outline
            content: System
            tap_action:
              action: navigate
