      # Gleiche Rasterstruktur wie die Startseite; nur Karten und Navigation werden je Seite angepasst.
      grid-template-columns: 300px minmax(0, 1fr) 54px
      grid-template-rows: 96px 1px minmax(0, 1fr) 64px
