# SP Dashboard · Startseite
# Home Assistant Lovelace Raw-Konfiguration
# Voraussetzungen über HACS installieren: Mushroom Cards, card-mod, layout-card, stack-in-card.
# Danach in Home Assistant unter Einstellungen → Dashboards → Raw-Konfigurationseditor einfügen
# oder als YAML-Dashboard referenzieren. Alle Mushroom Cards bleiben danach über die UI editierbar.

views:
  - title: Startseite
    path: startseite
    icon: mdi:home
    type: custom:grid-layout
    layout:
      # Optimiert für iPad Air 2020 Querformat: 1024 × 768 CSS-Pixel.
      grid-template-columns: 300px minmax(0, 1fr) 54px
      grid-template-rows: 96px 1px minmax(0, 1fr) 64px
      grid-template-areas: |
        "presence title close"
        "divider divider divider"
        "sidebar floorplan spacer"
        "nav nav nav"
      gap: 10px 16px
      margin: 0
      padding: 14px
      height: 100dvh
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: 1fr
          grid-template-rows: auto auto 1px auto auto auto
          grid-template-areas: |
            "title"
            "presence"
            "divider"
            "floorplan"
            "sidebar"
            "nav"
          padding: 16px
          gap: 14px
    background:
      opacity: 100
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: >-
        linear-gradient(180deg, rgba(5, 10, 36, 1) 0%, rgba(8, 14, 48, 1) 58%, rgba(15, 28, 82, 1) 100%)
    cards:
      # Kopfzeile links: Anwesenheit der Personen.
      - type: custom:stack-in-card
        view_layout:
          grid-area: presence
          align-self: center
          justify-self: start
        mode: vertical
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: 0;
              padding: 0;
            }
        cards:
          - type: markdown
            content: "**ANWESENHEIT**"
            card_mod:
              style: |
                ha-card {
                  color: rgba(255,255,255,.58);
                  background: transparent;
                  box-shadow: none;
                  border: 0;
                  font-size: 12px;
                  letter-spacing: .08em;
                  padding: 0 0 8px 0;
                }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.person_1
                name: Person 1
                icon_type: icon
                primary_info: none
                secondary_info: none
                layout: vertical
                card_mod:
                  style: &person_chip_style |
                    ha-card {
                      width: 44px;
                      height: 44px;
                      border-radius: 50%;
                      background: rgba(20, 30, 78, .48);
                      border: 1px solid rgba(156, 171, 218, .28);
                      box-shadow: none;
                      --icon-size: 24px;
                      --rgb-state-person-home: 42, 169, 255;
                      --rgb-state-person-not-home: 155, 160, 178;
                    }
              - type: custom:mushroom-person-card
                entity: person.person_2
                name: Person 2
                icon_type: icon
                primary_info: none
                secondary_info: none
                layout: vertical
                card_mod:
                  style: *person_chip_style

      # Dynamische Überschrift: Für Raumseiten nur title/subtitle/path kopieren und anpassen.
      - type: custom:mushroom-template-card
        view_layout:
          grid-area: title
          align-self: center
          justify-self: center
        primary: STARTSEITE
        secondary: Wohnung
        icon: none
        layout: vertical
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              width: 280px;
              margin: 0 auto;
              text-align: center;
              border-radius: 0;
              padding: 4px 0 0;
              background: transparent;
              border: 0;
              box-shadow: none;
              --card-primary-font-size: 26px;
              --card-primary-font-weight: 800;
              --card-primary-letter-spacing: .08em;
              --card-secondary-font-size: 12px;
              --card-secondary-color: rgba(255,255,255,.58);
            }

      - type: custom:mushroom-template-card
        view_layout:
          grid-area: close
          align-self: center
          justify-self: center
        icon: mdi:close-circle-outline
        primary_info: none
        secondary_info: none
        tap_action:
          action: navigate
          navigation_path: /lovelace/default_view
        card_mod:
          style: |
            ha-card {
              width: 44px;
              height: 44px;
              margin: 0 auto;
              border-radius: 50%;
              background: rgba(18, 28, 78, .46);
              border: 0;
              box-shadow: none;
              --icon-size: 24px;
              --card-mod-icon-color: rgb(42, 169, 255);
            }

      - type: markdown
        view_layout:
          grid-area: divider
        content: " "
        card_mod:
          style: |
            ha-card {
              height: 1px;
              min-height: 1px;
              padding: 0;
              background: rgba(145, 163, 218, .26);
              border: 0;
              box-shadow: none;
            }

      # Linke Sidebar der Startseite: Wetter und Kalender. Auf Raumseiten kann dieser Bereich andere Cards bekommen.
      - type: vertical-stack
        view_layout:
          grid-area: sidebar
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Wetter
            forecast_type: daily
            show_forecast: false
            card_mod:
              style: &glass_card |
                ha-card {
                  border-radius: 16px;
                  padding: 4px;
                  background: rgba(13, 20, 60, .62);
                  border: 1px solid rgba(156, 171, 218, .18);
                  box-shadow: 0 12px 34px rgba(0,0,0,.20);
                  color: rgba(255,255,255,.82);
                }
          - type: calendar
            entities:
              - calendar.home
            title: Kalender
            initial_view: listWeek
            card_mod:
              style: *glass_card

      # Zentraler Grundriss: Bildkarte mit frei verschiebbaren Mushroom Cards als Elemente.
      - type: picture-elements
        view_layout:
          grid-area: floorplan
        image: /local/sp-dashboard/floorplan.svg
        card_mod:
          style: |
            ha-card {
              width: min(100%, calc(100dvh - 172px));
              max-width: 100%;
              max-height: calc(100dvh - 204px);
              aspect-ratio: 1003 / 924;
              margin: 0 auto;
              background: rgba(8, 16, 50, .34);
              border: 0;
              box-shadow: 0 18px 54px rgba(0,0,0,.24);
              overflow: hidden;
            }
        elements:
          # Anpassbare Raumflächen: Größe/Position ändern und später auf Raumseiten verlinken.
          - type: custom:mushroom-template-card
            primary: ''
            secondary: ''
            icon: none
            tap_action:
              action: navigate
              navigation_path: /lovelace/wohnzimmer
            hold_action:
              action: more-info
            style: &room_area_wohnzimmer
              top: 70%
              left: 72%
              width: 31%
              height: 27%
              transform: translate(-50%, -50%)
              z-index: 1
            card_mod:
              style: &room_area_style |
                ha-card {
                  height: 100%;
                  min-height: 100%;
                  cursor: pointer;
                  background: rgba(42, 169, 255, .035);
                  border: 1px dashed rgba(42, 169, 255, .22);
                  border-radius: 12px;
                  box-shadow: none;
                }
                ha-card:hover {
                  background: rgba(42, 169, 255, .11);
                  border-color: rgba(42, 169, 255, .55);
                }
          - type: custom:mushroom-template-card
            primary: ''
            secondary: ''
            icon: none
            tap_action:
              action: navigate
              navigation_path: /lovelace/kueche
            hold_action:
              action: more-info
            style:
              top: 41%
              left: 73%
              width: 31%
              height: 22%
              transform: translate(-50%, -50%)
              z-index: 1
            card_mod:
              style: *room_area_style
          - type: custom:mushroom-template-card
            primary: ''
            secondary: ''
            icon: none
            tap_action:
              action: navigate
              navigation_path: /lovelace/buero
            hold_action:
              action: more-info
            style:
              top: 20%
              left: 69%
              width: 34%
              height: 26%
              transform: translate(-50%, -50%)
              z-index: 1
            card_mod:
              style: *room_area_style
          - type: custom:mushroom-template-card
            primary: ''
            secondary: ''
            icon: none
            tap_action:
              action: navigate
              navigation_path: /lovelace/schlafzimmer
            hold_action:
              action: more-info
            style:
              top: 69%
              left: 27%
              width: 29%
              height: 27%
              transform: translate(-50%, -50%)
              z-index: 1
            card_mod:
              style: *room_area_style
          - type: custom:mushroom-template-card
            primary: ''
            secondary: ''
            icon: none
            tap_action:
              action: navigate
              navigation_path: /lovelace/flur
            hold_action:
              action: more-info
            style:
              top: 44%
              left: 42%
              width: 19%
              height: 21%
              transform: translate(-50%, -50%)
              z-index: 1
            card_mod:
              style: *room_area_style
          - type: custom:mushroom-light-card
            entity: light.buero
            name: Büro Licht
            layout: horizontal
            primary_info: name
            secondary_info: none
            style: &floorplan_card_pos
              top: 10%
              left: 68%
              width: 140px
              z-index: 2
            card_mod:
              style: &floorplan_chip |
                ha-card {
                  border-radius: 999px;
                  background: rgba(12, 18, 48, .72);
                  border: 1px solid rgba(170, 184, 230, .22);
                  box-shadow: 0 10px 28px rgba(0,0,0,.24);
                  --icon-size: 20px;
                  --card-primary-font-size: 11px;
                  --card-primary-font-weight: 700;
                  color: rgba(255,255,255,.78);
                }
          - type: custom:mushroom-light-card
            entity: light.schlafzimmer
            name: Schlafzimmer Licht
            layout: horizontal
            primary_info: name
            secondary_info: none
            style:
              top: 67%
              left: 30%
              width: 165px
              z-index: 2
            card_mod:
              style: *floorplan_chip
          - type: custom:mushroom-light-card
            entity: light.wohnzimmer
            name: Wohnzimmer Licht
            layout: horizontal
            primary_info: name
            secondary_info: none
            style:
              top: 67%
              left: 82%
              width: 165px
              z-index: 2
            card_mod:
              style: *floorplan_chip
          - type: custom:mushroom-template-card
            entity: sensor.kueche_temperatur
            icon: mdi:thermometer
            primary: Küche
            secondary: Temperatur
            layout: horizontal
            style:
              top: 49%
              left: 84%
              width: 145px
              z-index: 2
            card_mod:
              style: *floorplan_chip
          - type: custom:mushroom-template-card
            entity: switch.neue_entitaet
            icon: mdi:gesture-tap-button
            primary: Neue Entität
            secondary: ''
            layout: horizontal
            style:
              top: 47%
              left: 57%
              width: 150px
              z-index: 2
            card_mod:
              style: *floorplan_chip
          - type: custom:mushroom-template-card
            entity: sensor.home_humidity
            icon: mdi:water-percent
            primary: "{{ states(entity) }}"
            secondary: ''
            layout: horizontal
            style:
              top: 10%
              left: 42%
              width: 116px
              z-index: 2
            card_mod:
              style: *floorplan_chip

      # Bottom-Navigation als Mushroom Chips. Spätere Raumseiten können hier ergänzt werden.
      - type: custom:mushroom-chips-card
        view_layout:
          grid-area: nav
        alignment: center
        chips:
          - type: template
            icon: mdi:home
            content: Startseite
            tap_action:
              action: navigate
              navigation_path: /lovelace/startseite
          - type: template
            icon: mdi:rocket-launch
            content: Übersicht
            tap_action:
              action: navigate
              navigation_path: /lovelace/uebersicht
          - type: template
            icon: mdi:heat-wave
            content: Klima
            tap_action:
              action: navigate
              navigation_path: /lovelace/klima
          - type: template
            icon: mdi:lightbulb-on-outline
            content: Lichter
            tap_action:
              action: navigate
              navigation_path: /lovelace/lichter
          - type: template
            icon: mdi:flash
            content: Strom
            tap_action:
              action: navigate
              navigation_path: /lovelace/strom
          - type: template
            icon: mdi:shield-home-outline
            content: Sicherheit
            tap_action:
              action: navigate
              navigation_path: /lovelace/sicherheit
          - type: template
            icon: mdi:cog-outline
            content: System
            tap_action:
              action: navigate
              navigation_path: /lovelace/system
        card_mod:
          style: |
            ha-card {
              width: min(760px, calc(100vw - 28px));
              margin: 0 auto;
              padding: 4px 18px;
              border-radius: 22px 22px 0 0;
              background: rgba(26, 35, 90, .78);
              border: 1px solid rgba(156, 171, 218, .12);
              box-shadow: 0 -18px 60px rgba(0,0,0,.22);
              --chip-background: transparent;
              --chip-box-shadow: none;
              --chip-border-width: 0;
              --chip-height: 44px;
              --chip-font-size: 10px;
              --chip-icon-size: 21px;
              --primary-text-color: rgba(255,255,255,.70);
            }
